name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check repository hygiene
        run: git diff --check

      - name: Validate skill repository
        shell: python
        run: |
          from pathlib import Path
          import re

          root = Path(".")
          required = [
              root / "README.md",
              root / "LICENSE",
              root / ".github" / "CODEOWNERS",
          ]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit(f"Missing required files: {', '.join(missing)}")

          for skill in root.rglob("SKILL.md"):
              lines = skill.read_text(encoding="utf-8").splitlines()
              if len(lines) < 4 or lines[0] != "---":
                  raise SystemExit(f"{skill}: missing YAML frontmatter")
              try:
                  closing = lines.index("---", 1)
              except ValueError:
                  raise SystemExit(f"{skill}: unterminated YAML frontmatter")
              frontmatter = lines[1:closing]
              for field in ("name", "description"):
                  if not any(line.startswith(f"{field}:") and line.split(":", 1)[1].strip() for line in frontmatter):
                      raise SystemExit(f"{skill}: missing non-empty {field}")

          link_pattern = re.compile(r"\[[^]]+\]\(([^)]+)\)")
          for markdown in root.rglob("*.md"):
              text = markdown.read_text(encoding="utf-8")
              for target in link_pattern.findall(text):
                  target = target.strip().split("#", 1)[0]
                  if not target or "://" in target or target.startswith(("mailto:", "/")):
                      continue
                  if not (markdown.parent / target).exists():
                      raise SystemExit(f"{markdown}: broken relative link {target}")
