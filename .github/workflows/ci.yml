name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@v24.2.0
        with:
          globs: "**/*.md"

      - name: Test package validator
        run: python3 -m unittest discover -s tests -v

      - name: Check product-model references against the API contract
        run: scripts/check-contract-tokens

      - name: Validate package, skills and links
        run: scripts/validate-package

      # The plugin itself must pack. kit/manifest.yaml and the Wizard compatibility check belong to the release cut
      # (release.yml), so a skills-only change needs no Wizard change or manifest refresh.
      - name: Build plugin archive
        run: scripts/kit-release build --out "$RUNNER_TEMP/plugin"

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      # npx skills add silently skips a skill whose front matter its YAML parser rejects (EG-1010).
      - name: Install skill front matter check
        working-directory: scripts/skill-frontmatter
        run: npm ci

      - name: Parse skill front matter as the skills installer does
        working-directory: scripts/skill-frontmatter
        run: |
          npm test
          npm run check

      - name: Validate Claude Code manifests
        run: |
          npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate --strict .
          npx --yes @anthropic-ai/claude-code@2.1.283 plugin validate --strict .claude-plugin/plugin.json

  account-scope:
    name: account-scope corpus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install corpus runner
        working-directory: fixtures/account-scope
        run: npm ci

      - name: Typecheck corpus runner
        working-directory: fixtures/account-scope
        run: npm run typecheck

      - name: Run corpus
        working-directory: fixtures/account-scope
        run: npm test
