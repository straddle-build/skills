clients:
  claude-code:
    observed_version: "2.1.289"
    observed: "2026-10-05: isolated candidate 0.1.1 install, validation and removal, and published 0.1.0-to-candidate 0.1.1 upgrade, passed on source 23a5d4ef5cb8b940579509b39d05ceaeabadbb37; archive sha256 1437093ccc629a183e99c44d77feeff83c63d16d5c71a7b4382156209f732e5b. No model session or Straddle request; not published 0.1.1 release-channel acceptance"
  codex:
    observed_version: "0.157.1"
    observed: "2026-10-05: isolated candidate 0.1.1 install, validation and removal, and published 0.1.0-to-candidate 0.1.1 upgrade, passed on source 23a5d4ef5cb8b940579509b39d05ceaeabadbb37; archive sha256 1437093ccc629a183e99c44d77feeff83c63d16d5c71a7b4382156209f732e5b. Both MCP URLs and STRADDLE_API_KEY bearer variable validated; no model session or Straddle request; not published 0.1.1 release-channel acceptance"
  cursor:
    observed_version: "3.22.12"
    observed: "2026-10-05, isolated desktop profile, pre-tag candidate (not published 0.1.1 release-channel acceptance). In separate runs the Cursor IDE imported https://github.com/straddle-build/skills as a team marketplace. Every import resolved the default branch at source f2d9656194612b4c15fdcbf881d884b93d5245c9, including an import of a /tree/v0.1.0 URL; the IDE import and marketplace edit offer no ref control. Install listed straddle 0.1.1 with 9 skills and straddle-api/straddle-docs, and a fresh reinstall after removal also succeeded. The Straddle API key variable field appeared under Configure after install, not at Add; no value was entered or saved. With the existing Local 0.1.0 plugin temporarily removed, the 0.1.1 plugin registered plugin-straddle-straddle-api and plugin-straddle-straddle-docs, and after reload both ran MCP initialization and tool discovery (straddle-api 4 tools) with no key and no tool call. Each run ended with uninstall and marketplace removal, and Local 0.1.0 and the plugin and MCP configuration files were restored with identical per-file sha256. Not restored: Cursor's own built-in skills sync and small ~/.cursor file rewrites, and the Straddle MCP transports were left connected where they had been idle-suspended. The Cursor web dashboard was inspected after a team-admin sign-in: Import from Repo takes only a repository URL and rejected https://github.com/straddle-build/skills/tree/v0.1.0 as an invalid URL format; the owner/repo import succeeded with no ref control, and its settings offer Refresh and Auto Refresh but no ref, tag or branch control; that marketplace was then deleted, returning the dashboard to no connected marketplace. Update was exercised with a fixture repository, hello-keith/me810-cursor-fixture-20261005 (public, Actions disabled): its default branch was pushed at 6e7320dc81c7a7c20464a7aec7fe1e5496b0e9e0 (plugin 0.1.0), imported as a team marketplace and the plugin added, and Cursor installed straddle from that commit (plugin.json 0.1.0, 9 skills, both MCP servers; the detail view showed no version label) with the Straddle API key field under Configure, left empty. The default branch was then fast-forwarded to f2d9656194612b4c15fdcbf881d884b93d5245c9 (0.1.1). About a minute later, after the marketplace view was opened and before Refresh was pressed, Cursor installed straddle from f2d9656 (plugin.json 0.1.1, 9 skills) and removed the 0.1.0 copy, with Auto Refresh on and no re-add or reconfiguration. The plugin was then uninstalled and the marketplace removed, and Local 0.1.0 was restored with identical per-file sha256. Deleting the fixture repository is pending with its owner. No business API request"
instructions:
  wizard:
    candidate: null
    release:
      install: |-
        (
          set -eu
          npm install --global @straddlecom/wizard@0.1.1
        )
      update: |-
        (
          set -eu
          npm install --global @straddlecom/wizard@0.1.1
        )
      remove: |-
        (
          set -eu
          npm uninstall --global @straddlecom/wizard
        )
      validate: |-
        (
          set -eu
          test "$(wizard --version)" = "0.1.1"
          test "$(npm view @straddlecom/wizard@0.1.1 dist.integrity)" = "sha512-wnWYdryNl4z1K71AM2HeHbbqRK0JMoekWTK49d8ezyLH+FPdQRhHkVqnIvVhcXlTJ6U9rcqms1K/Jmxud+Y6NA=="
        )
  claude-code:
    notes:
      - "Start Claude Code from a shell where STRADDLE_API_KEY is set; the plugin sends it as the straddle-api bearer token."
    candidate:
      install: |-
        (
          set -eu
          : "${STRADDLE_KIT_DIR:?set STRADDLE_KIT_DIR to a durable directory for Straddle kit artifacts}"
          cd "$STRADDLE_KIT_DIR"
          rm -rf claude-code-plugin.new
          echo "1437093ccc629a183e99c44d77feeff83c63d16d5c71a7b4382156209f732e5b  straddle-plugin-0.1.1.zip" | shasum -a 256 -c -
          unzip -q straddle-plugin-0.1.1.zip -d claude-code-plugin.new
          { test -z "$(cd claude-code-plugin.new && find . -mindepth 1 -maxdepth 1 ! -name .claude-plugin ! -name .codex-plugin ! -name .cursor-plugin ! -name LICENSE ! -name README.md ! -name assets ! -name mcp.json ! -name plugin.json ! -name skills ! -name third_party)" && test -z "$(cd claude-code-plugin.new && find . ! -type f ! -type d)" && test "$(cd claude-code-plugin.new && find .claude-plugin .codex-plugin .cursor-plugin LICENSE README.md assets mcp.json plugin.json skills third_party -type f | LC_ALL=C sort | while IFS= read -r f; do shasum -a 256 "$f"; done | shasum -a 256 | cut -c1-64)" = "d690233a7f5c9587959ae8b2191972f5e9110ddba93b99657e1e106f71c126a6"; } || { echo "claude-code-plugin.new is not exactly the verified plugin (plugin.content_sha256 d690233a7f5c9587959ae8b2191972f5e9110ddba93b99657e1e106f71c126a6): unexpected entries, links or content" >&2; rm -rf claude-code-plugin.new; exit 1; }
          rm -rf claude-code-plugin
          mv claude-code-plugin.new claude-code-plugin
          claude plugin marketplace add "$PWD/claude-code-plugin"
          claude plugin install straddle@straddle
        )
      update: |-
        (
          set -eu
          : "${STRADDLE_KIT_DIR:?set STRADDLE_KIT_DIR to a durable directory for Straddle kit artifacts}"
          cd "$STRADDLE_KIT_DIR"
          test -d claude-code-plugin || { echo "no installed plugin directory $PWD/claude-code-plugin; run install" >&2; exit 1; }
          rm -rf claude-code-plugin.new claude-code-plugin.old
          echo "1437093ccc629a183e99c44d77feeff83c63d16d5c71a7b4382156209f732e5b  straddle-plugin-0.1.1.zip" | shasum -a 256 -c -
          unzip -q straddle-plugin-0.1.1.zip -d claude-code-plugin.new
          { test -z "$(cd claude-code-plugin.new && find . -mindepth 1 -maxdepth 1 ! -name .claude-plugin ! -name .codex-plugin ! -name .cursor-plugin ! -name LICENSE ! -name README.md ! -name assets ! -name mcp.json ! -name plugin.json ! -name skills ! -name third_party)" && test -z "$(cd claude-code-plugin.new && find . ! -type f ! -type d)" && test "$(cd claude-code-plugin.new && find .claude-plugin .codex-plugin .cursor-plugin LICENSE README.md assets mcp.json plugin.json skills third_party -type f | LC_ALL=C sort | while IFS= read -r f; do shasum -a 256 "$f"; done | shasum -a 256 | cut -c1-64)" = "d690233a7f5c9587959ae8b2191972f5e9110ddba93b99657e1e106f71c126a6"; } || { echo "claude-code-plugin.new is not exactly the verified plugin (plugin.content_sha256 d690233a7f5c9587959ae8b2191972f5e9110ddba93b99657e1e106f71c126a6): unexpected entries, links or content" >&2; rm -rf claude-code-plugin.new; exit 1; }
          mv claude-code-plugin claude-code-plugin.old
          mv claude-code-plugin.new claude-code-plugin
          if claude plugin marketplace update straddle && claude plugin update straddle@straddle; then
            rm -rf claude-code-plugin.old
          else
            echo "update failed; restoring the previous plugin" >&2
            rm -rf claude-code-plugin
            mv claude-code-plugin.old claude-code-plugin
            claude plugin marketplace update straddle && claude plugin update straddle@straddle || true
            exit 1
          fi
        )
      remove: |-
        (
          set -eu
          : "${STRADDLE_KIT_DIR:?set STRADDLE_KIT_DIR to a durable directory for Straddle kit artifacts}"
          claude plugin uninstall straddle@straddle
          claude plugin marketplace remove straddle
          rm -rf "$STRADDLE_KIT_DIR/claude-code-plugin"
        )
      validate: |-
        (
          set -eu
          claude plugin list --json | python3 -c 'import json,sys; p={x["id"]: x for x in json.load(sys.stdin)}["straddle@straddle"]; assert p["version"]=="0.1.1" and p["enabled"] and {k: v["url"] for k, v in p["mcpServers"].items()}=={"straddle-api": "https://mcp.scalar.com/mcp/d5d1b1c2-ae5b-432d-b795-4fcb31cfdedd", "straddle-docs": "https://straddle-build-straddle-openapi.apidocumentation.com/mcp"}, p'
        )
    release:
      install: |-
        (
          set -eu
          : "${STRADDLE_KIT_DIR:?set STRADDLE_KIT_DIR to a durable directory for Straddle kit artifacts}"
          cd "$STRADDLE_KIT_DIR"
          rm -rf claude-code-plugin.new
          rm -rf claude-code-plugin.new.src
          git clone -q --depth 1 --branch v0.1.1 https://github.com/straddle-build/skills.git claude-code-plugin.new.src
          mkdir claude-code-plugin.new
