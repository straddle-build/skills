  cursor:
    manual: true
    notes:
      - "Cursor serves a team marketplace from the repository's default branch. Its import takes only the owner/repo URL and has no tag, branch or version control, so it can't select or pin tag v0.1.2."
      - "Cursor's copy is not checked against SHA256SUMS or plugin.content_sha256. Validate checks the installed version metadata, the skill count and the MCP server names, not file contents."
      - "Saving STRADDLE_API_KEY in Configure and an authenticated straddle-api call have not been exercised in Cursor."
      - "On 2026-10-05 a marketplace imported only in the Cursor team dashboard did not appear in the IDE catalog within 3 minutes. Importing the same repository from the IDE showed it at once, without a second dashboard marketplace. So the install imports from the IDE. Cursor's plugin docs describe Dashboard -> Plugins & MCPs -> Add Marketplace -> Import from Repo, and on Enterprise plans only admins can add team marketplaces."
    candidate: "not available from a local archive: Cursor imports a team marketplace from a GitHub repository's default branch"
    release:
      install:
        - "In the Cursor IDE, open Add Marketplace, choose Import from GitHub, enter https://github.com/straddle-build/skills, set Scope to Team and press Import."
        - "In the Cursor IDE, add the Straddle plugin from that marketplace."
        - "Open the Straddle plugin's Configure and enter your Straddle API key for STRADDLE_API_KEY. Cursor doesn't ask for it when you add the plugin."
      update:
        - "Refresh the team marketplace, or keep its Auto Refresh on, so Cursor reads the repository's default branch again."
      remove:
        - "Uninstall the Straddle plugin, then remove the team marketplace."
      validate:
        - "Check that the installed copy's .cursor-plugin/plugin.json, under ~/.cursor/plugins/cache/, has version 0.1.2."
        - "Check that Cursor shows 9 straddle-* skills and the straddle-api and straddle-docs MCP servers for the Straddle plugin."
